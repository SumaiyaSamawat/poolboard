
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billiard Pool Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Billiard Pool Game</h1>

    <div class="game-area">

        <!-- Boy player -->
        <div class="player boy">
            <div class="hair"></div>
            <div class="head">
                <div class="eyes"></div>
            </div>
            <div class="neck"></div>
            <div class="body">
                <div class="arm left-arm"></div>
                <div class="arm right-arm"></div>
            </div>
            <div class="legs">
                <div></div>
                <div></div>
            </div>
            <div class="cue-stick"></div>
            <p>Arfi</p>
        </div>

        <!-- Pool table -->
        <div class="table">
            <div class="playing-area">

                <!-- Six pockets -->
                <div class="pocket p1"></div>
                <div class="pocket p2"></div>
                <div class="pocket p3"></div>
                <div class="pocket p4"></div>
                <div class="pocket p5"></div>
                <div class="pocket p6"></div>

                <!-- Pool balls -->
                <div class="ball yellow">1</div>
                <div class="ball blue">2</div>
                <div class="ball red">3</div>
                <div class="ball purple">4</div>
                <div class="ball orange">5</div>
                <div class="ball green">6</div>
                <div class="ball maroon">7</div>
                <div class="ball eight">8</div>

                <div class="ball stripe stripe-yellow">9</div>
                <div class="ball stripe stripe-blue">10</div>
                <div class="ball stripe stripe-red">11</div>
                <div class="ball stripe stripe-purple">12</div>
                <div class="ball stripe stripe-orange">13</div>
                <div class="ball stripe stripe-green">14</div>
                <div class="ball stripe stripe-maroon">15</div>

                <!-- White cue ball -->
                <div class="ball cue"></div>

                <!-- Table markings -->
                <div class="table-line"></div>

            </div>
        </div>

        <!-- Girl player -->
        <div class="player girl">
            <div class="hair"></div>
            <div class="head">
                <div class="eyes"></div>
            </div>
            <div class="neck"></div>
            <div class="body">
                <div class="arm left-arm"></div>
                <div class="arm right-arm"></div>
            </div>
            <div class="legs">
                <div></div>
                <div></div>
            </div>
            <div class="cue-stick"></div>
            <p>Samawat</p>
        </div>

    </div>

</body>
</html>
